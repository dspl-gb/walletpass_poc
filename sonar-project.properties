# ── SonarCloud configuration ────────────────────────────────────────────
# After importing this repo in SonarCloud, replace the placeholders below
# with your actual organisation key and project key.
#
# The CI workflow (.github/workflows/ci.yml) expects a SONAR_TOKEN secret
# to be configured in the GitHub repo settings.
# ─────────────────────────────────────────────────────────────────────────

sonar.projectKey=YOUR_ORG_wallet-pass-demo
sonar.organization=YOUR_ORG

sonar.sources=src
sonar.tests=tests,e2e

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results/vitest-results.xml

sonar.sourceEncoding=UTF-8

# Ignore generated / vendored files
sonar.exclusions=\
  **/node_modules/**,\
  .next/**,\
  public/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  node-v*/**
